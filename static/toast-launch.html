<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>ClearComms Toast</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .toast-wrapper {
      width: 100%;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      position: relative;
    }

    .toast-wrapper.dark {
      color: #ffffff;
      --accent: #ffffff;
    }

    .toast-wrapper.light {
      color: #1a1a1a;
      --accent: #1a1a1a;
    }

    .icon {
      width: 48px;
      height: 48px;
      color: var(--accent);
    }

    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .body {
      font-weight: 400;
      font-size: 13px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 5px;
      width: 100%;
      background: #FFF;
      transform-origin: left;
      opacity: 0;
    }

    @keyframes shrink {
      from {
        transform: scaleX(1);
      }

      to {
        transform: scaleX(0);
      }
    }

    .progress-bar.animate {
      animation: shrink 5s linear forwards;
      opacity: 1;
    }

    .progress-bar.paused {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast-wrapper dark" role="button" tabindex="0">
    <svg id="icon" class="icon" viewBox="0 0 869.83 749.18" fill="currentColor" aria-hidden="true">
      <g id="Soundwaves">
        <path d="M576.28,475.23c15.17-30.28,23.72-64.46,23.72-100.64s-8.55-70.35-23.72-100.64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="60"/>
        <path d="M683.62,528.9c23.26-46.44,36.38-98.84,36.38-154.31s-13.11-107.88-36.38-154.31" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="60"/>
        <path d="M790.84,582.51c31.34-62.56,48.99-133.18,48.99-207.92s-17.65-145.36-48.99-207.92" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="60"/>
      </g>
      <path d="M494.9,546.34c-8.9-4.45-19.43-4.2-28.1.68-123.33,69.39-293.3-29.31-286.77-175.54-2.02-143.53,165.45-237.47,286.75-169.34,8.68,4.88,19.21,5.15,28.12.69l121.48-60.74c18.97-9.48,22.34-35.08,6.55-49.23C389.92-115.86-1.05,48.49,0,374.59c-1.05,326.1,389.98,490.45,622.93,281.72,15.79-14.15,12.41-39.74-6.55-49.23l-121.48-60.74Z"/>
    </svg>
    <div class="content">
      <div id="title" class="title"></div>
      <div id="body" class="body"></div>
    </div>
    <div id="progress" class="progress-bar"></div>
  </div>

  <script>
    const DISMISS_MS = 5000;
    const payload = window.__CLEARCOMMS_TOAST__ || {};

    const titleEl = document.getElementById('title');
    const bodyEl = document.getElementById('body');
    const toastEl = document.getElementById('toast');
    const progressEl = document.getElementById('progress');

    titleEl.textContent = payload.title || '';
    bodyEl.textContent = payload.body || '';
    if (payload.theme === 'light') toastEl.classList.replace('dark', 'light');

    let dismissTimer = null;
    let dismissRemaining = DISMISS_MS;
    let dismissLastStart = 0;

    function tauriInvoke(command, args) {
      try {
        const tauri = window.__TAURI__;
        if (!tauri) return Promise.resolve();
        if (tauri.core && typeof tauri.core.invoke === 'function') {
          return tauri.core.invoke(command, args);
        }
        if (typeof tauri.invoke === 'function') {
          return tauri.invoke(command, args);
        }
      } catch (e) {}
      return Promise.resolve();
    }

    function closeToast() {
      tauriInvoke('close_toast_window');
    }

    function showMainWindow() {
      tauriInvoke('show_main_window');
    }

    function startTimer() {
      progressEl.classList.add('animate');
      dismissLastStart = performance.now();
      dismissTimer = setTimeout(() => {
        closeToast();
      }, dismissRemaining);
    }

    function pauseTimer() {
      if (!dismissTimer) return;
      clearTimeout(dismissTimer);
      dismissTimer = null;
      progressEl.classList.add('paused');
      const elapsed = performance.now() - dismissLastStart;
      dismissRemaining -= elapsed;
    }

    function resumeTimer() {
      if (dismissTimer || dismissRemaining <= 0) return;
      progressEl.classList.remove('paused');
      dismissLastStart = performance.now();
      startTimer();
    }

    toastEl.addEventListener('mouseenter', pauseTimer);
    toastEl.addEventListener('mouseleave', resumeTimer);
    toastEl.addEventListener('click', () => {
      showMainWindow();
      closeToast();
    });
    toastEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        showMainWindow();
        closeToast();
      }
    });

    if (payload.title || payload.body) {
      startTimer();
    } else {
      closeToast();
    }
  </script>
</body>
</html>
